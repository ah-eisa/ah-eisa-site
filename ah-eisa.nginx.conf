server {
    listen 80;
    server_name ah-eisa.com;

    root /var/www/ah-eisa.com;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /insights {
        return 301 /insights.html;
    }

    location = /insights/ {
        return 301 /insights.html;
    }

    location ~* ^/insights/(assets/.*|style\.css|main\.js)$ {
        return 301 /$1;
    }

    location ~* ^/insights/(index|about|experience|projects|certifications|contact|privacy|terms|disclaimer|blog)\.html$ {
        return 301 /$1.html;
    }

    location /insights/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html =404;
    }

    location /api/publish {
        proxy_pass http://127.0.0.1:8099/publish;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }
}

server {
    listen 443 ssl http2;
    server_name ah-eisa.com;

    ssl_certificate /etc/letsencrypt/live/ah-eisa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ah-eisa.com/privkey.pem;

    root /var/www/ah-eisa.com;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /insights {
        return 301 /insights.html;
    }

    location = /insights/ {
        return 301 /insights.html;
    }

    location ~* ^/insights/(assets/.*|style\.css|main\.js)$ {
        return 301 /$1;
    }

    location ~* ^/insights/(index|about|experience|projects|certifications|contact|privacy|terms|disclaimer|blog)\.html$ {
        return 301 /$1.html;
    }

    location /insights/ {
        try_files $uri $uri/ $uri.html =404;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html =404;
    }

    location /api/publish {
        proxy_pass http://127.0.0.1:8099/publish;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }
}
