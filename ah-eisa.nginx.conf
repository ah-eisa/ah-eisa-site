server {
    listen 80;
    server_name ah-eisa.com www.ah-eisa.com;

    root /var/www/ah-eisa.com;
    index index.html;

    # Clean URLs for pages
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Clean URLs for insights
    location /insights/ {
        try_files $uri $uri/ $uri.html /insights.html =404;
    }

    # Decap CMS Admin
    location /admin/ {
        try_files $uri $uri/ /admin/index.html =404;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }
}
