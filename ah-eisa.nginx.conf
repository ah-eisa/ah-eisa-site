# HTTP - Redirect all to canonical HTTPS (preserving Let's Encrypt validation)
server {
    listen 80;
    server_name ah-eisa.com www.ah-eisa.com;

    server_tokens off;

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ah-eisa.com;
        default_type text/plain;
    }

    # Permanent 301 redirect to canonical HTTPS domain
    location / {
        default_type text/html;
        return 301 https://ah-eisa.com$request_uri;
    }
}

# HTTPS - Canonical Production Host
server {
    listen 443 ssl http2;
    server_name ah-eisa.com www.ah-eisa.com;

    ssl_certificate /etc/letsencrypt/live/ah-eisa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ah-eisa.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Redirect www to apex canonical host
    if ($host = www.ah-eisa.com) {
        return 301 https://ah-eisa.com$request_uri;
    }

    root /var/www/ah-eisa.com;
    index index.html;

    server_tokens off;
    autoindex off;
    client_max_body_size 2m;

    # Custom MIME Types
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    # Security Headers
    include /etc/nginx/snippets/ah-eisa-security-headers.conf;

    # Block hidden files (dotfiles) except .well-known
    location ~* (^|/)\.(?!well-known/) {
        return 404;
    }

    # Block sensitive files, scripts, databases, backups, and configs
    location ~* \.(bak.*|old.*|orig|save|sql|sqlite|db|log|sh|py|conf|yml|yaml|md|ini|env.*)$ {
        return 404;
    }

    # Block internal content storage
    location ^~ /content/ {
        return 404;
    }

    # Operational source is not part of the public website.
    location ^~ /deploy/ {
        return 404;
    }
    location ^~ /tests/ {
        return 404;
    }

    # Block retired/legacy admin and auth interfaces
    location ^~ /admin {
        return 404;
    }
    location ^~ /auth {
        return 404;
    }
    location = /auth.html {
        return 404;
    }
    location = /api/publish {
        return 404;
    }

    # Canonical clean URL redirects (main pages)
    if ($request_uri = /index.html) {
        return 301 /;
    }


    location ~* ^/(about|experience|projects|certifications|contact|cv|privacy|terms|disclaimer|thank-you|blog)\.html$ {
        return 301 /$1;
    }

    # Main clean URL routing
    location / {
        default_type text/html;
        try_files $uri $uri/ $uri.html =404;
    }

    # Insights article routing and clean URLs (served directly, no redirect chains)
    location = /insights {
        try_files /insights.html =404;
    }
    location = /insights/ {
        return 301 /insights;
    }
    location = /insights.html {
        return 301 /insights;
    }
    location ~* ^/insights/(assets/.*|style\.css|main\.js)$ {
        return 301 /$1;
    }
    location ~* ^/insights/(index|about|experience|projects|certifications|contact|privacy|terms|disclaimer|blog)\.html$ {
        return 301 /$1;
    }
    location ~ ^/insights/([A-Za-z0-9-]+)(?:/(?:index(?:\.html)?)?|\.html)$ {
        return 301 /insights/$1;
    }
    location ~ ^/insights/([A-Za-z0-9-]+)$ {
        try_files /insights/$1.html =404;
    }
    location /insights/ {
        return 404;
    }

    # Retired / non-public directories
    location ^~ /improved_articles_version {
        return 404;
    }

    # Hardened Contact Form API Endpoint
    location = /api/contact {
        proxy_pass http://127.0.0.1:8099/contact;
        proxy_set_header Host $host;
        proxy_set_header X-Ah-Eisa-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        client_max_body_size 64k;
    }

    # Short cache for crawler files so edge/browser copies refresh quickly
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        include /etc/nginx/snippets/ah-eisa-security-headers.conf;
    }

    # Static Assets with Cache-Control and Security Headers
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|pdf|webp|woff|woff2|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        include /etc/nginx/snippets/ah-eisa-security-headers.conf;
    }
}
