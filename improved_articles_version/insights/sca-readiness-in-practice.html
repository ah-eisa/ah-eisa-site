<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Licence-to-Launch: SCA Readiness in Practice | Ahmed Eisa</title>
  <meta name="description" content="A practical roadmap to move from concept to regulatory go-live under the UAE’s SCA framework. Covers entity structuring, governance design, and inspection readiness based on EmCoin’s operational build.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../main.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .post-content {
      margin-top: 20px;
      line-height: 1.6;
    }
    .post-content h1, .post-content h2, .post-content h3 {
      margin-top: 1.5em;
      margin-bottom: 0.8em;
    }
    .post-content p {
      margin-bottom: 1em;
    }
    .post-content ul {
      list-style-type: disc;
      margin-left: 20px;
      margin-bottom: 1em;
    }
    .post-content strong {
      font-weight: 600;
    }
  </style>
</head>
<body>
<header id="site-header"></header>

<main class="container narrow">

  <div class="page-header">
    <div class="section-eyebrow">Views & Commentary</div>
    <h1>Licence-to-Launch: SCA Readiness in Practice</h1>
    <div class="post-meta">October 1, 2025 · Regulatory Strategy, Fintech</div>
  </div>

  <div class="post-content" id="post-content">
    <!-- Markdown content will be loaded here -->
  </div>

</main>

<footer id="site-footer"></footer>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const postContentDiv = document.getElementById("post-content");
    try {
      const response = await fetch("sca-readiness-in-practice.md");
      const markdown = await response.text();
      postContentDiv.innerHTML = marked.parse(markdown);
    } catch (error) {
      console.error("Failed to load Markdown content:", error);
      postContentDiv.innerHTML = "<p>Error loading article content.</p>";
    }
  });
</script>

</body>
</html>
